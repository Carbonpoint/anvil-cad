[package]
name = "anvil-ui"
description = "Anvil desktop UI: ribbon, part navigator, property panel, viewport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Developer only tools: offscreen pictures of the whole window, used for
# layout checks and for the pictures in docs/tutorials. Off in a normal
# build, so the shipped application carries none of it.
devtools = []

[dependencies]
anvil-math.workspace = true
anvil-kernel.workspace = true
anvil-feature.workspace = true
anvil-io.workspace = true
anvil-cam.workspace = true
anvil-sketch.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
sysinfo.workspace = true
log.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "shot"
required-features = ["devtools"]
